name: build-bundle

# PyInstaller 번들 빌드는 v* 태그(와 수동 실행)에서만 돈다(P18). 로컬에서는 돌리지 않는다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # 태그 릴리스에 설치 파일 첨부 (기본 토큰은 읽기 전용)

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest 는 arm64 — Intel Mac 용은 macos-15-intel 로 따로 만든다 (설치 파일 이름에 arch 가 들어간다)
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성
        run: uv sync --group build
      - name: 태그 ↔ pyproject 버전 검사 (태그 푸시)
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python packaging/build.py --check-tag ${{ github.ref_name }}
      - name: 테스트
        run: uv run pytest -q
      - name: 웹 프런트 빌드
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Inno Setup 6 보장 (Windows — 러너에 없을 때만 설치)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          $std = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not $iscc -and -not (Test-Path $std)) {
            choco install innosetup -y --no-progress
          }
      - name: 번들 빌드·스모크·설치 파일
        run: uv run --group build python packaging/build.py --skip-web
      - uses: actions/upload-artifact@v4
        with:
          name: trader-${{ github.ref_name }}-${{ matrix.os }}
          path: |
            dist/trader-*.dmg
            dist/trader-*-setup.exe
          if-no-files-found: error
      - name: 릴리스 첨부 (태그 푸시)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/trader-*.dmg
            dist/trader-*-setup.exe
