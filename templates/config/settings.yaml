# 시장 목록·웹 서버·알림(notify)·LLM 설정. 기능별 섹션은 해당 기능이 추가된 뒤 이 파일에 적는다.
markets: [KR, US]

# 리스크 한도 (공격적 기본값, 스펙 §0.2 #5). 파이썬 risk/rules 가 강제한다.
risk:
  max_position_pct: 0.25
  max_positions: 5
  daily_loss_stop_pct: -0.05
  stop_loss_pct: -0.15
  min_cash_pct: 0.0
  max_sector_pct: 0.40     # 같은 섹터(config/sectors.yaml) 합계 상한. BUY/ADD 뒤 초과면 거부. 헤지 ETF 는 제외
  max_theme_pct: 0.20      # 같은 테마(오늘 상위 테마, Phase 25) 합계 상한. BUY/ADD 뒤 초과면 거부
  chase_limit_pct: 0.10    # 당일 등락률이 이 이상이면 신규 매수(BUY·ADD) 금지 — 급등 추격 방지
  killswitch_drawdown_pct: 0.15   # 누적 손실 킬스위치: 계좌·시장 NAV 가 시작(해제 시점) 대비 −15% 면 신규 매수 중단, 해제는 M6 의 killswitch 명령(미구현)
  theme_max_horizon_days: 10  # 오늘 상위 테마 종목의 BUY·ADD 는 보유 10일 이하·익절가 필수
  risk_per_trade_pct: 0.02 # 1회 손실 한도: 손절까지 잃는 금액 ≤ NAV × 2% 로 BUY/ADD 수량을 자른다(전체 검토 L9)
  # 보유기간 프로필(Phase 23). 결정의 horizon_days 로 short(≤10 거래일)·mid(11~40)·long(>40) 을 고른다.
  #   move_pct: 평단 대비 이만큼 움직이면 재평가 트리거 / reeval_interval_min: 같은 종목 재평가 최소 간격
  #   periodic_check_min: 시간 단위 정기 재평가(단기만, 0 = 없음; 변동이 move_pct/2 이상일 때만, 운영일 ≤ 6회)
  #   news_min_novel: 뉴스 재분석에 필요한 새 뉴스 건수 / daily_reanalyze_every: 보유 종목 아침 재분석 주기(운영일)
  horizon_profiles:
    short: { move_pct: 0.04, reeval_interval_min: 15, periodic_check_min: 60, news_min_novel: 1, daily_reanalyze_every: 1 }
    mid:   { move_pct: 0.07, reeval_interval_min: 30, periodic_check_min: 0,  news_min_novel: 1, daily_reanalyze_every: 2 }
    long:  { move_pct: 0.10, reeval_interval_min: 60, periodic_check_min: 0,  news_min_novel: 3, daily_reanalyze_every: 5 }
  # 아침 미체결 재호가(Phase 23). 개장 after_min 분 뒤 운영일 1회, 오늘 지정가 미체결을 취소 → 같은 결정으로
  # 현재가 지정가 재제출(게이트 재통과). 원 지정가보다 max_chase_pct 넘게 불리하면 재제출 없이 알림만. dry-run·off 제외
  reprice: { enabled: true, after_min: 30, max_chase_pct: 0.01 }

# 하락장 대응: 국면 판정 3지표 + 인버스 ETF 헤지 슬리브 (전부 파이썬 규칙)
hedge:
  enabled: true
  max_weight_pct: 0.20     # 계좌 NAV 대비 헤지 포지션 상한(시장별)
  min_weight_pct: 0.05     # 시장 세션(에이전트) 제안이 bear 헤지 비중을 낮출 수 있는 하한
  market_session: true     # 매일 시장 세션(거시 애널리스트 + 강세/약세 토론 + 전략가 제안) 1회. 제안은 비중만 조절, 진입 여부는 국면 규칙
  leverage: true           # 3지표 모두 켜지면 −2x, 아니면 −1x
  bear_min_signals: 2      # 3지표(200일선 아래·20일 수익률 ≤ −5%·변동성 높음) 중 n개 이상이면 bear
  exit_streak_days: 5      # bear 해제: 지표 ≤ 1개가 이 일수 연속
  agent_signal: false      # 전략가 RISK_OFF 를 국면 4번째 지표로 — 한도 기울기(agent_gate)와 이중 반영이라 기본 끔
  agent_min_confidence: 0.7  # 전략가 제안을 지표·보류로 쓸 최소 confidence
  agent_gate: true         # 전략가 제안(확신 ≥ agent_min_confidence)이 국면 한도를 한 칸 옮김
  flow_signal: false       # KR 외인 수급(KODEX 200 20일·5일 순매수 합 모두 음수)을 보조 국면 지표로 (데이터 확인 뒤 켬)
  switch_instruments: false  # bear 유지 중 −1x↔−2x 판정이 switch_streak_days 연속 어긋나면 교체(전량 매도 → 다음 날 재진입)
  switch_streak_days: 3
  ma_days: 200             # 지표 ①: 지수 proxy 종가 < 이 일수 단순이동평균
  momentum_days: 20        # 지표 ②: 이 거래일 수익률
  momentum_min: -0.05      # 지표 ②: 수익률 ≤ 이 값이면 약세
  vix_min: 25.0            # 지표 ③(US): FRED VIX ≥ 이 값
  realized_vol_min: 0.25   # 지표 ③(KR·VIX 없음): proxy 20일 실현변동성(연율) ≥ 이 값
  instruments:
    KR: {inverse: "114800", inverse2x: "252670"}                       # KODEX 인버스 / KODEX 200선물인버스2X
    US: {inverse: {symbol: SH, exchange: AMS}, inverse2x: {symbol: SDS, exchange: AMS}}  # ProShares (Arca → KIS AMS)
  index_proxy:
    KR: "069500"                                                        # KODEX 200 일봉 = 국면 판정용 지수 proxy
    US: {symbol: SPY, exchange: AMS}

# 권리 일정 블랙아웃(기본 끔): 예탁원 기준일 5일 전 ~ 2일 뒤 신규 매수 금지(수집은 매일, 국내만)
event_blackout:
  enabled: false
  kinds: [paidin, bonus, rev_split, merger_split]   # 유상증자·무상증자·액면교체·합병·분할
  before_days: 5
  after_days: 2

web:
  bind: 127.0.0.1
  port: 8787

notify:
  enabled: true
  poll_interval_s: 30

# 역할별 모델 (스펙 §4.1). 강세·약세 리서처는 같은 모델(2026-10-26 전체 검토 L11 — 이전엔 약세만 opus).
models:
  orchestrator: sonnet
  screener: haiku
  scout: sonnet       # 종목 발굴(Phase 19): 시장 뉴스로 유니버스 안 → 상장 전체
  analyst: sonnet
  researcher_bull: sonnet
  researcher_bear: sonnet  # 강세와 같은 모델(전체 검토 L11 — 비대칭이면 정당한 수렴도 '아첨' 으로 판정)
  market_researcher_bull: sonnet  # 시장 세션 리서처(regime)
  market_researcher_bear: sonnet  # 강세와 같은 모델(같은 대칭 이유)
  trader: opus
  reflector: sonnet
  briefing: haiku
  strategist: sonnet  # 시장 세션 전략가(헤지 비중 제안). md 기본은 opus

anonymize: false      # true 면 프롬프트 직전 종목명·티커 치환
claude_bin: null      # null 이면 PATH 에서 claude 탐색

# 오케스트레이터 세션 예산·동시성 (스펙 §4.1)
llm:
  budget_usd: 5.0        # 세션당 --max-budget-usd (전문 전달 세션은 $2~3, 실기 확인)
  timeout_s: 900         # 세션 타임아웃(종류별은 timeout_by_kind 기본값: 스크리너·발굴 300, 재평가 600). 600 에서 분석 35% 가 시간 초과(2026-10-29)
  timeout_by_kind:       # 종류별 타임아웃(초). 키를 두면 기본 dict 를 통째로 바꾸므로 기본값도 함께 적는다
    screen: 300
    discover: 300
    resume: 600
    fo_resume: 600
    reflect: 600
    market: 600          # 시장 세션(거시·토론·전략가)
  daily_session_cap: 80  # 하루 세션 수 고정 상한 (종목 analyze + 시장 세션 + 장중 발굴·재분석). Phase 24 에 40→80 — 2~4주 통계 뒤 다시 정한다
  usage_throttle:        # 구독 사용률 감속: 세션 rate_limit_event·상태줄 파일의 최신 관측 기준
    enabled: true
    soft_pct: 0.80       # 5시간·7일 창 중 하나라도 80% 이상이면 보유 재평가만
    hard_pct: 0.95       # 95% 이상이면 새 세션 전부 중지
    max_age_h: 6         # 이보다 오래된 관측은 무시(고정 상한만)
  market_session_cap: 2  # 시장 세션(거시·토론·전략가) 하루 상한. 큐로 다시 눌러도 이 수를 넘지 않는다
  usage_file: ~/.claude/rate_limits.json  # 대화형 claude 상태줄이 남기는 구독 사용률 관측 파일 (웹 대시보드)
  usage_probe:           # 데몬이 주기적으로 haiku 단발 호출 1회로 사용률·초기화 시각 확인(웹 사용량 블록 실시간)
    enabled: true
    interval_min: 30     # 확인 주기
    skip_if_recent_min: 5  # 최근 이 시간 안에 세션 관측이 있으면 건너뜀

debate_rounds: 1      # 0~2. 독립 의견(라운드 0) + 반박 라운드 수
debate:
  # 애널리스트 4명이 모두 같은 방향(NEUTRAL 제외)·확신 ≥ 기준이면 토론 없이 트레이더로 (전체 검토 L17, 세션 비용)
  skip_on_consensus: true
  consensus_min_conviction: 0.7

# KIS 체결통보 웹소켓(데몬 잡 notice_listener). 켜면 통보마다 체결 동기화(fills_sync)를 바로 당긴다.
# HTS ID(secrets KIS_HTS_ID)가 필요하고, 실전은 실전 계좌 모드가 off 가 아닐 때만 붙는다
fill_notice:
  enabled: false

# 노는 현금 단기금리 ETF 운용(기본 끔): 하락(bear) 국면이라 신규 매수가 막힌 동안만 남는 현금을
# 사고(reserve_pct 는 NAV 대비 현금으로 남김, min_amount 보다 적으면 사지 않음), 국면이 풀리면 판다. 국내만
cash_park:
  enabled: false
  ticker: "357870"
  reserve_pct: 0.20
  min_amount: 500000

# 주간 리밸런스: 최근 결정(lookback_days 안)의 target_weight 대비 band_pct(비중) 넘게 벗어난 보유만
# 되돌린다(TRIM 먼저). 시각은 schedule.yaml rebalance
rebalance:
  enabled: true
  band_pct: 0.05
  lookback_days: 30

# 테마 열기 감지(scan 기능): 오늘 불이 붙은 테마를 점수로 고른다 — 감지·알림·scout 입력만, 매매는 분석 세션.
# 주기는 schedule.yaml theme.interval_s
theme:
  enabled: true
  top_n: 3                  # 알림·scout·게이트가 보는 상위 테마 수 (1~10)
  min_cluster_titles: 3     # 키워드 테마: 새 뉴스 제목 공출현 최소 건수 (≥2)
  weights: {news: 0.35, rank: 0.25, flow: 0.15, saveticker: 0.10, vol: 0.15}

# 메모리 검색 (스펙 §6.5): 3층 반감기(일), 워밍업 건수, 서킷브레이커 기준
memory:
  half_lives: {short: 14, mid: 90, long: 365}
  warmup: 50
  drawdown_stop_pct: -0.10
  vix_spike_pct: 0.30
  top_k: 5

# 장중 뉴스 발굴 (Phase 23). 뉴스 수집(30분)마다 **새 내용** 뉴스가 있으면 같은 종목도 재분석(오늘 결정이
# 있으면 재평가 세션), 유니버스 밖은 scout 세션(discover)으로 발굴. 유사 기사(같은 사건의 다른 매체 기사)는
# 파이썬이 걸러 세션을 띄우지 않는다. 장중 창(monitor 시간) 안에서만.
discovery:
  intraday:
    enabled: true
    min_items: 1          # 종목 재분석에 필요한 새 뉴스 건수
    discover_cap: 20      # 시장별 하루 discover(scout) 세션 상한
    similarity: {jaccard: 0.6, ratio: 0.8, lookback_days: 3}   # 유사 판정: 토큰 Jaccard / 문자열 유사도 / 비교 기간

# 아침 브리핑(Stock docs/06): 평일 KST 07:20 에 haiku 단발 1회 → 텔레그램 5줄(결정·주문과 무관); 시각은 schedule.yaml briefing
briefing:
  enabled: true
  daily_cap: 1      # haiku 단발 하루 상한(0~5)
  timeout_s: 120
