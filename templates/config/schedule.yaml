# 데몬 잡 주기
job_queue:
  interval_s: 10     # 큐 틱(job_queue·fast·reeval·info) 주기(초)
telegram_poll:
  interval_s: 30     # 텔레그램 명령 폴링·알림 재전송 주기(초)
ledger_backup: "17:10"   # 원장 백업(KST, 매일): 14일치 일별 + 8주치 월요일 보관
news_collect:
  interval_s: 1800   # 시장 뉴스 저장소 수집 주기(초)
kr:
  monitor:
    interval_s: 60     # 장중 감시 주기(초)
    start: "09:00"     # 감시 창(시장 현지 시각)
    end: "15:30"
us:
  monitor:
    interval_s: 60
    start: "09:30"
    end: "16:00"
fills_sync:
  times: ["16:10", "07:10"]   # 체결 동기화(KST, 월~토): KR 마감 뒤, US 마감 뒤
reconcile:
  kr: "15:45"                                     # 야간 대사: KR 마감(15:30 KST) 뒤
  us: {time: "16:15", tz: America/New_York}       # US 마감(16:00 ET) 뒤
rebalance:                                        # 주간 리밸런스(금요일, 시장 현지 시각)
  kr: {time: "14:30", days: fri}
  us: {time: "15:00", tz: America/New_York, days: fri}
balance_refresh:
  interval_s: 300   # 잔고 스냅샷 갱신 주기(초): 장중 매 틱, 장 밖은 30분 넘은 스냅샷만
scan_analyze:                                     # 스캔 → 분석(평일, 시장 현지 시각)
  kr: "07:30"
  us: {time: "08:30", tz: America/New_York}
regime:                                           # 국면 → scan → analyze 순서(scan_analyze 5분 앞)
  kr: "07:25"                                     # 국면 판정 → 시장 세션 → 재판정(평일)
  us: {time: "08:25", tz: America/New_York}
ksd_events: "07:05"   # 예탁원 권리 일정 수집(KST, 평일) — KR 시장이면 블랙아웃이 꺼져 있어도 모아 둔다
theme:
  interval_s: 1800   # 테마 열기 감지 주기(초, 300~86400): 장중만
ml_train: {time: "10:00", days: sat}   # 퀀트 모델 주간 재학습(KST, 토요일)
features_snapshot: "06:30"   # 피처 스토어 일일 스냅샷(KST, 매일): US 마감(06:00 KST) 뒤·universe_members 앞 — 완결 봉만 적재
universe_members: "06:40"   # 시점 유니버스 기록(KST, 매일): 그날 유니버스+보유 종목을 학습의 구성원 이력으로 남긴다
