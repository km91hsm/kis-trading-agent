[project]
name = "trader"
version = "0.3.6"
description = "LLM 멀티 에이전트 + ML 주식 자동매매 (KIS)"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12",
    "fastapi",
    "httpx",
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2",
    "pyarrow>=17",
    "pydantic>=2",
    "pypdf>=6,<7",
    "pystray>=0.19.5",
    "python-dotenv",
    "pyyaml",
    "requests>=2",
    "scikit-learn>=1.5",
    "typer",
    "tzdata",
    "uvicorn[standard]",
    "youtube-transcript-api>=1",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4"]
# PPO 백엔드. macOS x86_64(Intel) 는 torch 2.2.2 가 마지막 휠이라 SB3 2.3·gymnasium 0.29 로 핀한다.
rl = [
    "gymnasium>=1.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "stable-baselines3>=2.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "gymnasium>=0.29,<1.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "stable-baselines3>=2.3,<2.4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch<=2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
trader = "trader.kernel.cli.main:app"

[dependency-groups]
# playwright: 확장 JS 를 실제 Chromium 으로 시험하는 tests/features/saveticker/test_*_browser.py 전용
dev = [
    "playwright>=1.56,<2",
    "pytest",
    "respx",
    "ruff",
]
# 번들 빌드(packaging/build.py·make_icons.py): uv sync --group build
build = [
    "pillow>=10",
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["slow: 학습·백필 등 8초 이상 걸리는 테스트"]
# 테스트 하나가 5분을 넘기면 모든 스레드의 스택을 출력한다(CI 무한 대기 진단용 — 테스트를 죽이지는 않는다)
faulthandler_timeout = 300
