[project]
name = "trader"
version = "0.2.0"
description = "LLM 멀티 에이전트 + ML 주식 자동매매 (KIS)"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi",
    "httpx",
    "pydantic>=2",
    "python-dotenv",
    "pyyaml",
    "typer",
    "tzdata",
    "uvicorn[standard]",
]

[project.scripts]
trader = "trader.kernel.cli.main:app"

[dependency-groups]
dev = [
    "pytest",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
