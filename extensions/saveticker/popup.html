<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SaveTicker 수집</title><link rel="stylesheet" href="popup.css"><body><main><h1>SaveTicker 수집</h1><p id="version">확장 · 수집기 버전 확인 중</p><p id="connection" role="status" aria-live="polite">상태 확인 중…</p><div class="actions"><button id="start">수집 시작</button><button id="stop">중지</button></div><button id="resume" class="resume">직접 확인 후 재개</button><label><input type="checkbox" id="api-mode"> 숨김 API 수집 (시험 중)</label><p id="api-coverage"></p><label><input type="checkbox" id="html-refresh"> 정상 페이지 갱신 35분 시험</label><p id="html-trial"></p><label><input type="checkbox" id="auto-recheck"> 재확인 안내 시 1회 자동 새로고침</label><p id="recheck-status"></p><label><input type="checkbox" id="repeat-recheck"> 정상 수집 10분 후 새 사건 복구 허용</label><label><input type="checkbox" id="keep-minimized"> 수집 중 전용 창 최소화 유지</label><p id="window-status">화면 확인은 수집을 중지한 뒤 진행하세요.</p><dl id="lanes"><div><dt>뉴스 · 본문</dt><dd id="news">대기</dd></div><div><dt>커뮤니티 순위</dt><dd id="community">대기</dd></div><div><dt>증시 순위</dt><dd id="market">대기</dd></div><div><dt>캘린더 · 리포트</dt><dd id="background">대기</dd></div></dl><p id="pdf-state"></p><p id="updated">아직 수집 기록이 없습니다.</p><details><summary>진단 보기</summary><ul id="diagnostics"></ul></details><p class="help">확인이 필요하면 전용 탭에서 로그인·보안 확인을 마친 뒤 재개하세요. Chrome이 켜져 있는 동안 수집하며, PDF는 다운로드의 SaveTicker 폴더에 저장합니다.</p></main><script src="popup.js" type="module"></script></body></html>
